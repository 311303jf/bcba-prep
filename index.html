let state=loadState(); let obIndex=0; let currentDomain='B'; let currentConcept='Positive Reinforcement'; let currentQuestion=null; let currentMode='guided'; let timer=null; let seconds=0;
function freshState(){const domains={};DOMAINS.forEach(d=>domains[d.id]={accuracy:0,stability:0,retention:0,total:0,correct:0,last:0,concepts:{}});return{onboarded:false,profile:{},readiness:22,streak:1,domains,history:[],queue:[],usedFingerprints:[],currentView:'dashboard',learned:{},confidenceLog:[],adminConfigured:false};}
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE))||freshState()}catch(e){return freshState()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function langSwitch(){return `<div class="lang-switch"><button class="lang-btn ${lang==='en'?'active':''}" data-lang="en">EN</button><button class="lang-btn ${lang==='es'?'active':''}" data-lang="es">ES</button></div>`}
function bindLang(){document.querySelectorAll('.lang-btn').forEach(btn=>{btn.onclick=()=>{lang=btn.dataset.lang;localStorage.setItem('bcba_lang',lang);if(qs('landing').classList.contains('active')){renderLanding();return}if(qs('onboarding').classList.contains('active')){renderOnboarding();return}if(qs('app').classList.contains('active')){const view=state.currentView||'dashboard';if(view==='dashboard')renderDashboard();else if(view==='study')renderStudy();else if(view==='practice')renderQuestionSafe();else if(view==='challenge')renderChallenge(currentDomain);else if(view==='analytics')renderAnalytics();else renderDashboard();}}})}function renderQuestionSafe(){if(currentQuestion){bindNav();updateSide();renderQuestion()}else{renderPractice({domain:currentDomain,concept:currentConcept,mode:currentMode})}}
function showToast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s';setTimeout(()=>t.remove(),260)},2300)}
function fingerprint(q){return String((q.q||'')+' '+Object.values(q.options||{}).join(' ')).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().slice(0,260)}
function optionQuality(q){const vals=Object.values(q.options||{}).map(x=>String(x).trim().toLowerCase()); if(vals.length!==4)return false; if(new Set(vals).size!==4)return false; if(!['A','B','C','D'].includes(q.correct))return false; if(!q.q||q.q.length<70)return false; if(!q.rationale||q.rationale.length<60)return false; return true}
function qualityCheck(q){const fp=fingerprint(q); if(state.usedFingerprints.includes(fp))return false; return optionQuality(q)}
function getAdminKey(){return localStorage.getItem(KEY_STORAGE)||''}
async function callProvider(prompt,maxTokens=1300){const key=getAdminKey(); if(!key) throw new Error('No admin key'); if(API_PROVIDER==='anthropic'){const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})});const data=await res.json(); if(data.error) throw new Error(data.error.message); return data.content?.find(b=>b.type==='text')?.text||''} throw new Error('Provider not configured')}
function cleanJson(txt){return JSON.parse(String(txt).replace(/```json|```/g,'').trim())}
async function generateQuestion(target){const dom=DOMAINS.find(d=>d.id===target.domain)||DOMAINS[1];const concept=target.concept||pickConcept(dom.id);const mode=target.mode||'guided';const length=mode==='exam'?'3 to 4 sentence clinical scenario':'2 to 3 sentence clinical scenario';const prompt=`Create ONE original BCBA exam preparation clinical practice item. Do not mention technology. Use English. Align to BACB 6th Edition Test Content Outline. Domain ${dom.id}: ${dom.title}. Target concept: ${concept}. Difficulty mode: ${mode}. Requirements: ${length}; four plausible options; no repeated option meanings; one clearly correct answer; strong distractors; clinical rationale explaining why correct is correct and why distractors are wrong. Return ONLY valid JSON with keys: domain, concept, difficulty, q, options {A,B,C,D}, correct, hint, rationale.`;try{const raw=await callProvider(prompt,1600);const q=cleanJson(raw);if(qualityCheck(q))return q;throw new Error('quality failed')}catch(e){const pool=FALLBACK_QUESTIONS.filter(x=>x.domain===dom.id||x.concept===concept);return JSON.parse(JSON.stringify(pool[Math.floor(Math.random()*pool.length)]||FALLBACK_QUESTIONS[Math.floor(Math.random()*FALLBACK_QUESTIONS.length)]))}}
function pickConcept(domId){const d=DOMAINS.find(x=>x.id===domId)||DOMAINS[1];let low=d.concepts[0];let min=999;d.concepts.forEach(c=>{const rec=state.domains[domId].concepts[c]||{total:0,correct:0,last:0};const score=(rec.correct/(rec.total||1))*60 + Math.min(40,(Date.now()-rec.last)/86400000); if(score<min){min=score;low=c}});return low}
function recommendedTarget(){let worst='B',score=999;DOMAINS.forEach(d=>{const r=state.domains[d.id];const s=(r.stability||0)*.45+(r.retention||0)*.35+(r.accuracy||0)*.2 - d.weight*.4;if(s<score){score=s;worst=d.id}});return{domain:worst,concept:pickConcept(worst),mode:'guided'}}
async function ensureQueue(){while(state.queue.length<4){const t=recommendedTarget(); const q=await generateQuestion(t); const fp=fingerprint(q); if(!state.usedFingerprints.includes(fp)&&optionQuality(q)){state.queue.push(q);state.usedFingerprints.push(fp); if(state.usedFingerprints.length>80)state.usedFingerprints=state.usedFingerprints.slice(-80); save()}else break}}
function startPreload(){ensureQueue().catch(()=>{})}
function renderLanding(){qs('landCard').innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div class="brand-row" style="margin-bottom:0"><div class="brand-icon">🧠</div><div><div class="brand-name">BCBA Study Hub</div><div class="brand-tagline">Clinical Mastery Platform</div></div></div>${langSwitch()}</div><div class="hero-box"><div class="hero-eyebrow">${L('heroEye')}</div><div class="hero-heading">${L('heroHead')}</div><div class="hero-sub">${L('heroSub')}</div></div><div class="trust-grid"><div class="trust-item">${L('trust1')}</div><div class="trust-item">${L('trust2')}</div><div class="trust-item">${L('trust3')}</div><div class="trust-item">${L('trust4')}</div></div><button class="cta-btn" id="startBtn">${L('start')}</button><div class="checklist">${['check1','check2','check3','check4','check5'].map(k=>`<div class="check-item"><div class="check-dot">✓</div>${L(k)}</div>`).join('')}</div>`;bindLang();qs('startBtn').onclick=()=>{qs('landing').classList.remove('active');qs('onboarding').classList.add('active');renderOnboarding()}}
function renderOnboarding(){const step=obSteps[obIndex];const dots=obSteps.map((_,i)=>`<div class="pdot ${i===obIndex?'active':''}"></div>`).join('');qs('onboardCard').innerHTML=`<div class="progress-dots">${dots}</div><div class="onboard-step">Step ${obIndex+1} of ${obSteps.length}</div><div class="onboard-q">${step.q}</div><div class="onboard-sub">${step.sub}</div><div class="onboard-opts">${step.opts.map(o=>`<button class="onboard-opt ${state.profile[step.key]===o[0]?'selected':''}" data-val="${o[0]}"><span class="opt-emoji">${o[1]}</span>${o[2]}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center">${langSwitch()}<button class="btn btn-primary" id="obNext" style="margin-left:auto;opacity:${state.profile[step.key]?1:.45}" ${state.profile[step.key]?'':'disabled'}>${obIndex===obSteps.length-1?L('obStart'):L('obNext')}</button></div>`;bindLang();document.querySelectorAll('.onboard-opt').forEach(b=>b.onclick=()=>{state.profile[step.key]=b.dataset.val;save();renderOnboarding()});qs('obNext').onclick=()=>{if(obIndex<obSteps.length-1){obIndex++;renderOnboarding()}else{state.onboarded=true;save();qs('onboarding').classList.remove('active');qs('app').classList.add('active');renderDashboard();showToast('Your study path is ready.')}}}
function navHtml(){const items=[['dashboard','🏠',L('dashboard')],['study','🎓',L('learn')],['practice','🧩',L('practice')],['challenge','⏱',L('challenge')],['analytics','📊',L('analytics')]];return `<div class="nav-section">Study</div>${items.map(i=>`<button class="nav-btn ${state.currentView===i[0]?'active':''}" data-view="${i[0]}"><span>${i[1]}</span>${i[2]}</button>`).join('')}<div class="nav-section">Domains</div>${DOMAINS.map(d=>`<button class="nav-btn" data-domain="${d.id}"><span>DOM. ${d.id}</span>${d.short}</button>`).join('')}`}
function bindNav(){qs('nav').innerHTML=navHtml();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.currentView=b.dataset.view;save();render()});document.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>{currentDomain=b.dataset.domain;state.currentView='study';save();renderStudy()})}
function calcReadiness(){let acc=0,st=0,ret=0;DOMAINS.forEach(d=>{const r=state.domains[d.id];acc+=r.accuracy*d.weight;st+=r.stability*d.weight;ret+=r.retention*d.weight});const total=DOMAINS.reduce((s,d)=>s+d.weight,0);return Math.round((acc*.35+st*.4+ret*.25)/total)||22}
function updateSide(){state.readiness=calcReadiness();qs('sidePct').textContent=state.readiness+'%';qs('sideProgress').style.width=state.readiness+'%';qs('sideText').textContent=state.readiness<50?'Building foundation':state.readiness<72?'Improving toward readiness':'Stable readiness range'}
function renderDashboard(){state.currentView='dashboard';bindNav();updateSide();const rec=recommendedTarget();const dom=DOMAINS.find(d=>d.id===rec.domain);const atRisk=atRiskConcepts();qs('main').innerHTML=`<div class="hero-dash"><div><div class="hero-kicker">Welcome back</div><div class="hero-title">Today has a clear purpose.</div><div class="hero-copy">Your path is balancing weak areas with retention checks so your knowledge stays stable across domains.</div><button class="btn btn-gold" id="continueBtn" style="margin-top:14px">Continue Study Session</button></div><div class="readiness-ring" style="--p:${state.readiness}"><div class="readiness-content"><div class="readiness-num">${state.readiness}%</div><div class="readiness-lbl">Exam Readiness</div></div></div></div><div class="metrics"><div class="metric"><div class="metric-value">${DOMAINS.length}</div><div class="metric-label">domains monitored</div></div><div class="metric"><div class="metric-value">${state.queue.length}</div><div class="metric-label">items ready</div></div><div class="metric"><div class="metric-value">${state.history.length}</div><div class="metric-label">responses analyzed</div></div><div class="metric"><div class="metric-value">${state.streak}</div><div class="metric-label">day study streak</div></div></div><div class="panel-grid"><div class="panel"><div class="panel-title">Recommended Focus</div><div class="panel-sub">Selected to strengthen both performance and retention.</div><div class="focus-card"><div class="focus-concept">DOM. ${rec.domain} · ${rec.concept}</div><div class="focus-reason">Reason: this area can raise readiness while preventing uneven preparation.</div></div><button class="btn btn-primary" id="startFocus">Start Focus Session</button></div><div class="panel"><div class="panel-title">Today’s Session</div><div class="panel-sub">Designed to create progress without overload.</div><div class="session-list"><div class="session-item"><span>Retention warm-up</span><strong>8 min</strong></div><div class="session-item"><span>Focused concept work</span><strong>14 min</strong></div><div class="session-item"><span>Integrated clinical cases</span><strong>12 min</strong></div><div class="session-item"><span>Reflection + next step</span><strong>3 min</strong></div></div></div></div><div class="panel" style="margin-bottom:16px"><div class="panel-title">At Risk of Forgetting</div><div class="panel-sub">Previously learned areas that need light review before they decay.</div>${atRisk.length?atRisk.map(x=>`<span class="status-pill review" style="margin:3px">${x}</span>`).join(''):'<span class="status-pill stable">No high-risk concepts yet</span>'}</div><div style="display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px"><div style="font-family:var(--font-display);font-size:21px;font-weight:900">Domain Stability</div><button class="btn btn-secondary" id="resetBtn">Reset Prototype</button></div><div class="domain-grid">${DOMAINS.map(domainCard).join('')}</div>`;qs('continueBtn').onclick=()=>renderPractice();qs('startFocus').onclick=()=>{currentDomain=rec.domain;currentConcept=rec.concept;renderStudy()};qs('resetBtn').onclick=()=>{if(confirm('Reset local prototype progress?')){localStorage.removeItem(STORAGE);state=freshState();location.reload()}};document.querySelectorAll('[data-open-domain]').forEach(b=>b.onclick=()=>{currentDomain=b.dataset.openDomain;renderStudy()})}
function domainStatus(d){const r=state.domains[d.id];if(r.total<2)return ['review','New'];if(r.stability>=72&&r.retention>=70)return ['stable','Stable'];if(r.retention<48||r.stability<45)return ['risk','At Risk'];return ['review','Review']}
function domainCard(d){const r=state.domains[d.id];const st=domainStatus(d);return `<div class="domain-card"><div class="domain-head"><div><div class="domain-code">DOM. ${d.id}</div><div class="domain-title">${d.title}</div><div class="domain-meta">${d.concepts.length} focus areas · ${d.weight}% exam weight</div></div><span class="status-pill ${st[0]}">${st[1]}</span></div><div class="bar-label"><span>Accuracy</span><span>${r.accuracy||0}%</span></div><div class="mini-bar"><div class="mini-fill" style="width:${r.accuracy||0}%"></div></div><div class="bar-label"><span>Stability</span><span>${r.stability||0}%</span></div><div class="mini-bar"><div class="mini-fill" style="width:${r.stability||0}%;background:linear-gradient(90deg,var(--gold),#E8A030)"></div></div><div class="bar-label"><span>Retention</span><span>${r.retention||0}%</span></div><div class="mini-bar"><div class="mini-fill" style="width:${r.retention||0}%;background:linear-gradient(90deg,var(--blue),#5EA0E5)"></div></div><div class="domain-actions"><button class="btn btn-secondary" data-open-domain="${d.id}">Learn</button><button class="btn btn-primary" onclick="event.stopPropagation();currentDomain='${d.id}';renderPractice()">Practice</button></div></div>`}
function atRiskConcepts(){let arr=[];DOMAINS.forEach(d=>{Object.entries(state.domains[d.id].concepts).forEach(([c,r])=>{const days=(Date.now()-(r.last||0))/86400000;if(r.total>=2&&days>3)arr.push(c)})});return arr.slice(0,5)}
function renderStudy(){state.currentView='study';bindNav();updateSide();const d=DOMAINS.find(x=>x.id===currentDomain)||DOMAINS[1];currentConcept=currentConcept&&d.concepts.includes(currentConcept)?currentConcept:d.concepts[0];const content=STATIC_LEARN[currentConcept]||{def:`${currentConcept} is a high-yield BCBA concept within ${d.title}.`,example:'A behavior analyst applies this concept while making clinical decisions based on observable behavior and environmental variables.',strategy:'Identify the behavior, the environmental event, the timing, and the effect on future responding.'};qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">DOM. ${d.id} · Learn</div><div class="page-sub">${d.title}</div></div><div class="topbar-right">${langSwitch()}<button class="btn btn-secondary" id="backDash">Dashboard</button></div></div><div class="learn-wrap"><div class="learn-card"><div class="module-label" style="color:${d.color}">Guided Concept</div><div class="module-title">${currentConcept}</div><div class="definition">${content.def}</div><div class="section-label">Clinical Example</div><p style="font-size:14px;line-height:1.8;color:var(--ink-mid)">${content.example}</p><div class="note-box"><strong>Exam Strategy:</strong> ${content.strategy}</div><div class="section-label">Choose another focus area</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${d.concepts.map(c=>`<button class="status-pill ${c===currentConcept?'stable':'review'}" data-concept="${c}">${c}</button>`).join('')}</div><button class="btn btn-primary" id="practiceConcept">Practice this concept →</button></div></div>`;bindLang();qs('backDash').onclick=renderDashboard;document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{currentConcept=b.dataset.concept;renderStudy()});qs('practiceConcept').onclick=()=>renderPractice({domain:currentDomain,concept:currentConcept,mode:'guided'})}
async function renderPractice(target){state.currentView='practice';bindNav();updateSide();target=target||recommendedTarget();currentDomain=target.domain||currentDomain;currentConcept=target.concept||pickConcept(currentDomain);currentMode=target.mode||'guided';qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">${L('practice')}</div><div class="page-sub">Original scenario-based items with guided feedback.</div></div><div class="topbar-right">${langSwitch()}<button class="btn btn-secondary" id="toDash">${L('dashboard')}</button></div></div><div class="practice-wrap" id="practiceMount"><div class="question-card"><div class="loader"><div class="spinner"></div><div><strong>Preparing your next clinical item...</strong><br><span style="font-size:12px">The next item is being checked for quality and uniqueness.</span></div></div></div></div>`;bindLang();qs('toDash').onclick=renderDashboard;currentQuestion=state.queue.shift()||await generateQuestion({domain:currentDomain,concept:currentConcept,mode:currentMode});save();startPreload();renderQuestion()}
function renderQuestion(){const q=currentQuestion;const d=DOMAINS.find(x=>x.id===q.domain)||DOMAINS[1];seconds=0;if(timer)clearInterval(timer);timer=setInterval(()=>{seconds++;const el=qs('timePill');if(el)el.textContent=`⏱ ${seconds}s`},1000);qs('practiceMount').innerHTML=`<div class="question-card"><div class="question-head"><div><div class="question-meta">DOM. ${q.domain} · ${q.concept||'Clinical Reasoning'} · ${q.difficulty||'guided'}</div></div><div class="timer-pill" id="timePill">⏱ 0s</div></div><div class="question-text">${q.q}</div><div id="opts">${Object.entries(q.options).map(([l,t])=>`<button class="option" data-answer="${l}"><span class="option-letter">${l}</span><span>${t}</span></button>`).join('')}</div><div class="confidence-panel"><div class="conf-label">${L('confidence')}</div><div class="conf-opts"><button class="conf-btn" data-conf="low">${L('unsure')}</button><button class="conf-btn" data-conf="mid">${L('somewhat')}</button><button class="conf-btn" data-conf="high">${L('very')}</button></div></div><button class="btn btn-secondary" id="hintBtn">💡 ${L('hint')}</button><div id="hintBox" class="note-box hidden">${q.hint||'Break the scenario into antecedent, behavior, consequence, and future effect.'}</div><div id="feedbackMount"></div></div>`;let conf=null;document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{conf=b.dataset.conf;document.querySelectorAll('[data-conf]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});qs('hintBtn').onclick=()=>qs('hintBox').classList.toggle('hidden');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuestion(b.dataset.answer,conf||'none'))}
function answerQuestion(letter,conf){if(timer)clearInterval(timer);const q=currentQuestion;const ok=letter===q.correct;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(b.dataset.answer===q.correct)b.classList.add('correct');else if(b.dataset.answer===letter)b.classList.add('wrong')});recordAnswer(q,letter,ok,conf,seconds);qs('feedbackMount').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="feedback-title">${ok?L('correctMsg'):L('incorrectMsg')}</div><p>${q.rationale}</p>${!ok&&conf==='high'?'<p style="margin-top:8px"><strong>Confidence Alert:</strong> This was a high-confidence miss. The concept will return in a future review so the misconception does not stabilize.</p>':''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" id="nextQ">${L('nextItem')}</button><button class="btn btn-secondary" id="studyIt">${L('reviewConcept')}</button><button class="btn btn-gold" id="challengeIt">${L('examReality')}</button></div>`;qs('nextQ').onclick=()=>renderPractice();qs('studyIt').onclick=()=>{currentDomain=q.domain;currentConcept=q.concept;renderStudy()};qs('challengeIt').onclick=()=>renderChallenge(q.domain)}
function recordAnswer(q,letter,ok,conf,time){const dom=state.domains[q.domain]||state.domains.B;dom.total++;dom.correct+=ok?1:0;dom.last=Date.now();dom.accuracy=Math.round((dom.correct/dom.total)*100);const c=q.concept||'General';dom.concepts[c]=dom.concepts[c]||{total:0,correct:0,last:0,confidenceMiss:0};dom.concepts[c].total++;dom.concepts[c].correct+=ok?1:0;dom.concepts[c].last=Date.now();if(!ok&&conf==='high')dom.concepts[c].confidenceMiss++;dom.stability=Math.min(100,Math.round((dom.accuracy*.55)+((dom.total>=5?35:dom.total*7))-(recentMissPenalty(q.domain))));dom.retention=Math.min(100,Math.max(12,Math.round(dom.stability-(daysSince(dom.last)*3)+(ok?8:-4))));state.history.unshift({ts:Date.now(),domain:q.domain,concept:c,ok,conf,time,answer:letter,correct:q.correct});state.history=state.history.slice(0,120);state.readiness=calcReadiness();save();updateSide()}
function recentMissPenalty(domId){return state.history.slice(0,6).filter(x=>x.domain===domId&&!x.ok).length*7}
function daysSince(ts){return ts?((Date.now()-ts)/86400000):10}
async function renderChallenge(domId){state.currentView='challenge';bindNav();updateSide();currentDomain=domId||currentDomain;qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">Domain Challenge</div><div class="page-sub">Exam Reality Mode: longer clinical stems, no hints, feedback at the end.</div></div><button class="btn btn-secondary" id="dash">Dashboard</button></div><div class="complete-card"><div class="module-label">DOM. ${currentDomain}</div><div class="module-title">Ready for a realistic challenge?</div><p class="page-sub">This mode uses 3–4 sentence scenarios and integrated clinical reasoning. It should feel closer to the exam.</p><button class="btn btn-gold" id="startChallenge" style="margin-top:16px">Start 5-Item Challenge</button></div>`;qs('dash').onclick=renderDashboard;qs('startChallenge').onclick=async()=>{let score=0,idx=0,items=[];qs('main').innerHTML='<div class="loader"><div class="spinner"></div><strong>Preparing exam-level items...</strong></div>';for(let i=0;i<5;i++)items.push(await generateQuestion({domain:currentDomain,concept:pickConcept(currentDomain),mode:'exam'}));function show(){const q=items[idx];qs('main').innerHTML=`<div class="question-card"><div class="question-head"><div class="question-meta">Domain Challenge · Item ${idx+1}/5 · DOM. ${q.domain}</div><div class="timer-pill">Exam Reality</div></div><div class="question-text">${q.q}</div>${Object.entries(q.options).map(([l,t])=>`<button class="option" data-ch="${l}"><span class="option-letter">${l}</span><span>${t}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const ok=b.dataset.ch===q.correct;score+=ok?1:0;recordAnswer(q,b.dataset.ch,ok,'exam',0);idx++;idx<items.length?show():finish()})}function finish(){qs('main').innerHTML=`<div class="complete-card"><div style="font-size:48px">${score>=4?'🏆':score>=3?'📈':'🎯'}</div><div class="module-title">Challenge Complete</div><p class="page-sub">Score: <strong>${score}/5</strong>. ${score>=4?'This domain is moving toward stable readiness.':'This domain needs another stabilization cycle.'}</p><div class="note-box">Remember: readiness is not just today’s score. The goal is stable performance across time and across mixed clinical scenarios.</div><button class="btn btn-primary" onclick="renderDashboard()">Back to Dashboard</button></div>`}show()}}
function renderAnalytics(){state.currentView='analytics';bindNav();updateSide();qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">Performance Insights</div><div class="page-sub">Focus on stability, retention, and readiness — not just accuracy.</div></div></div><div class="metrics"><div class="metric"><div class="metric-value">${state.readiness}%</div><div class="metric-label">exam readiness</div></div><div class="metric"><div class="metric-value">${Math.round(avg('stability'))}%</div><div class="metric-label">average stability</div></div><div class="metric"><div class="metric-value">${Math.round(avg('retention'))}%</div><div class="metric-label">average retention</div></div><div class="metric"><div class="metric-value">${state.history.filter(x=>!x.ok&&x.conf==='high').length}</div><div class="metric-label">confidence alerts</div></div></div><div class="domain-grid">${DOMAINS.map(domainCard).join('')}</div><div class="panel" style="margin-top:16px"><div class="panel-title">Recent Clinical Reasoning History</div><div class="session-list">${state.history.slice(0,10).map(h=>`<div class="session-item"><span>${h.ok?'✓':'✗'} DOM. ${h.domain} · ${h.concept}</span><strong>${h.conf}</strong></div>`).join('')||'<div class="session-item"><span>No responses yet</span><strong>—</strong></div>'}</div></div>`;document.querySelectorAll('[data-open-domain]').forEach(b=>b.onclick=()=>{currentDomain=b.dataset.openDomain;renderStudy()})}
function avg(k){return DOMAINS.reduce((s,d)=>s+(state.domains[d.id][k]||0),0)/DOMAINS.length}
function render(){if(!qs('app').classList.contains('active')&&state.onboarded){qs('landing').classList.remove('active');qs('onboarding').classList.remove('active');qs('app').classList.add('active')}if(state.currentView==='dashboard')renderDashboard();else if(state.currentView==='study')renderStudy();else if(state.currentView==='practice')renderPractice();else if(state.currentView==='challenge')renderChallenge();else if(state.currentView==='analytics')renderAnalytics();else renderDashboard()}
function adminModal(){qs('adminModal').classList.add('active');qs('adminKeyInput').value=getAdminKey()}qs('saveAdminKey').onclick=()=>{localStorage.setItem(KEY_STORAGE,qs('adminKeyInput').value.trim());state.adminConfigured=!!getAdminKey();save();qs('adminModal').classList.remove('active');showToast('Admin key saved locally.');startPreload()};qs('closeAdmin').onclick=()=>qs('adminModal').classList.remove('active');document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&String(e.key).toLowerCase()==='a')adminModal()});window.renderDashboard=renderDashboard;
renderLanding(); if(state.onboarded)render(); startPreload();
})();
</script>
</body>
