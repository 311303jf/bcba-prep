function loadState(){try{const raw=JSON.parse(localStorage.getItem(STORAGE));if(!raw||!raw.domains||!raw.profile)return freshState();const base=freshState();return {...base,...raw,domains:{...base.domains,...raw.domains},profile:{...base.profile,...raw.profile},queue:Array.isArray(raw.queue)?raw.queue:[],history:Array.isArray(raw.history)?raw.history:[],usedFingerprints:Array.isArray(raw.usedFingerprints)?raw.usedFingerprints:[]}}catch(e){return freshState()}}

function fingerprint(q){return String((q.q||'')+' '+Object.values(q.options||{}).join(' ')).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().slice(0,260)}
function optionQuality(q){const vals=Object.values(q.options||{}).map(x=>String(x).trim().toLowerCase()); if(vals.length!==4)return false; if(new Set(vals).size!==4)return false; if(!['A','B','C','D'].includes(q.correct))return false; if(!q.q||q.q.length<70)return false; if(!q.rationale||q.rationale.length<60)return false; return true}
function qualityCheck(q){const fp=fingerprint(q); if(state.usedFingerprints.includes(fp))return false; return optionQuality(q)}
function getAdminKey(){return localStorage.getItem(KEY_STORAGE)||''}
async function callProvider(prompt,maxTokens=1300){const key=getAdminKey(); if(!key) throw new Error('No admin key'); if(API_PROVIDER==='anthropic'){const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})});const data=await res.json(); if(data.error) throw new Error(data.error.message); return data.content?.find(b=>b.type==='text')?.text||''} throw new Error('Provider not configured')}
function cleanJson(txt){return JSON.parse(String(txt).replace(/```json|```/g,'').trim())}
async function generateQuestion(target){const dom=DOMAINS.find(d=>d.id===target.domain)||DOMAINS[1];const concept=target.concept||pickConcept(dom.id);const mode=target.mode||'guided';const length=mode==='exam'?'3 to 4 sentence clinical scenario':'2 to 3 sentence clinical scenario';const prompt=`Create ONE original BCBA exam preparation clinical practice item. Do not mention technology. Use ${lang==='es'?'Spanish':'English'}. Align to BACB 6th Edition Test Content Outline. Domain ${dom.id}: ${dom.title}. Target concept: ${concept}. Difficulty mode: ${mode}. Requirements: ${length}; four plausible options; no repeated option meanings; one clearly correct answer; strong distractors; clinical rationale explaining why correct is correct and why distractors are wrong. Return ONLY valid JSON with keys: domain, concept, difficulty, q, options {A,B,C,D}, correct, hint, rationale.`;try{const raw=await callProvider(prompt,1600);const q=cleanJson(raw);if(qualityCheck(q))return q;throw new Error('quality failed')}catch(e){const pool=FALLBACK_QUESTIONS.filter(x=>x.domain===dom.id||x.concept===concept);return JSON.parse(JSON.stringify(pool[Math.floor(Math.random()*pool.length)]||FALLBACK_QUESTIONS[Math.floor(Math.random()*FALLBACK_QUESTIONS.length)]))}}
function pickConcept(domId){const d=DOMAINS.find(x=>x.id===domId)||DOMAINS[1];let low=d.concepts[0];let min=999;d.concepts.forEach(c=>{const rec=state.domains[domId].concepts[c]||{total:0,correct:0,last:0};const score=(rec.correct/(rec.total||1))*60 + Math.min(40,(Date.now()-rec.last)/86400000); if(score<min){min=score;low=c}});return low}
function recommendedTarget(){let worst='B',score=999;DOMAINS.forEach(d=>{const r=state.domains[d.id];const s=(r.stability||0)*.45+(r.retention||0)*.35+(r.accuracy||0)*.2 - d.weight*.4;if(s<score){score=s;worst=d.id}});return{domain:worst,concept:pickConcept(worst),mode:'guided'}}
async function ensureQueue(){while(state.queue.length<4){const t=recommendedTarget(); const q=await generateQuestion(t); const fp=fingerprint(q); if(!state.usedFingerprints.includes(fp)&&optionQuality(q)){state.queue.push(q);state.usedFingerprints.push(fp); if(state.usedFingerprints.length>80)state.usedFingerprints=state.usedFingerprints.slice(-80); save()}else break}}

function renderDashboard(){state.currentView='dashboard';bindNav();updateSide();const rec=recommendedTarget();const dom=DOMAINS.find(d=>d.id===rec.domain);const atRisk=atRiskConcepts();qs('main').innerHTML=`<div class="topbar"><div></div><div class="topbar-right">${langSwitch()}</div></div><div class="hero-dash"><div><div class="hero-kicker">${L('welcomeBack')}</div><div class="hero-title">${L('todayPurpose')}</div><div class="hero-copy">${L('pathBalance')}</div><button class="btn btn-gold" id="continueBtn" style="margin-top:14px">${L('continueStudy')}</button></div><div class="readiness-ring" style="--p:${state.readiness}"><div class="readiness-content"><div class="readiness-num">${state.readiness}%</div><div class="readiness-lbl">${L('examReadiness')}</div></div></div></div><div class="metrics"><div class="metric"><div class="metric-value">${DOMAINS.length}</div><div class="metric-label">${L('domainsMonitored')}</div></div><div class="metric"><div class="metric-value">${state.queue.length}</div><div class="metric-label">${L('itemsReady')}</div></div><div class="metric"><div class="metric-value">${state.history.length}</div><div class="metric-label">${L('responsesAnalyzed')}</div></div><div class="metric"><div class="metric-value">${state.streak}</div><div class="metric-label">${L('dayStudyStreak')}</div></div></div><div class="panel-grid"><div class="panel"><div class="panel-title">${L('recommendedFocus')}</div><div class="panel-sub">${L('recommendedSub')}</div><div class="focus-card"><div class="focus-concept">DOM. ${rec.domain} · ${tConcept(rec.concept)}</div><div class="focus-reason">${L('reasonFocus')}</div></div><button class="btn btn-primary" id="startFocus">${L('startFocus')}</button></div><div class="panel"><div class="panel-title">${L('todaysSession')}</div><div class="panel-sub">${L('todaySub')}</div><div class="session-list"><div class="session-item"><span>${L('warmup')}</span><strong>8 min</strong></div><div class="session-item"><span>${L('focusedWork' function renderStudy(){state.currentView='study';bindNav();updateSide();const d=DOMAINS.find(x=>x.id===currentDomain)||DOMAINS[1];currentConcept=currentConcept&&d.concepts.includes(currentConcept)?currentConcept:d.concepts[0];const base=STATIC_LEARN[currentConcept];const content=base||{def:`${currentConcept} is a high-yield BCBA concept within ${d.title}.`,example:'A behavior analyst applies this concept while making clinical decisions based on observable behavior and environmental variables.',strategy:'Identify the behavior, the environmental event, the timing, and the effect on future responding.',def_es:`${tConcept(currentConcept)} es un concepto de alto valor dentro de ${tDomainTitle(d)}.`,example_es:'Un analista de conducta aplica este concepto al tomar decisiones clínicas basadas en conducta observable y variables ambientales.',strategy_es:'Identifica la conducta, el evento ambiental, el momento en que ocurre y el efecto sobre la respuesta futura.'};qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">DOM. ${d.id} · ${L('learn')}</div><div class="page-sub">${tDomainTitle(d)}</div></div><div class="topbar-right">${langSwitch()}<button class="btn btn-secondary" id="backDash">${L('backDashboard')}</button></div></div><div class="learn-wrap"><div class="learn-card"><div class="module-label" style="color:${d.color}">${L('guidedConcept')}</div><div class="module-title">${tConcept(currentConcept)}</div><div class="definition">${qText(content,'def')}</div><div class="section-label">${L('clinicalExample')}</div><p style="font-size:14px;line-height:1.8;color:var(--ink-mid)">${qText(content,'example')}</p><div class="note-box"><strong>${L('examStrategy')}:</strong> ${qText(content,'strategy')}</div><div class="section-label">${L('chooseFocus')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">${d.concepts.map(c=>`<button class="status-pill ${c===currentConcept?'stable':'review'}" data-concept="${c}">${tConcept(c)}</button>`).join async function renderPractice(target){state.currentView='practice';bindNav();updateSide();target=target||recommendedTarget();currentDomain=target.domain||currentDomain;currentConcept=target.concept||pickConcept(currentDomain);currentMode=target.mode||'guided';qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">${L('clinicalPractice')}</div><div class="page-sub">${L('practiceSub')}</div></div><div class="topbar-right">${langSwitch()}<button class="btn btn-secondary" id="toDash">${L('backDashboard')}</button></div></div><div class="practice-wrap" id="practiceMount"><div class="question-card"><div class="loader"><div class="spinner"></div><div><strong>${L('preparingItem')}</strong><br><span style="font-size:12px">${L('qualityCheck')}</span></div></div></div></div>`;bindLang();qs('toDash').onclick=renderDashboard;currentQuestion=state.queue.shift()||await generateQuestion({domain:currentDomain,concept:currentConcept,mode:currentMode});save();startPreload();renderQuestion()}
function renderQuestion(){const q=currentQuestion;const d=DOMAINS.find(x=>x.id===q.domain)||DOMAINS[1];const opts=qOptions(q);seconds=0;if(timer)clearInterval(timer);timer=setInterval(()=>{seconds++;const el=qs('timePill');if(el)el.textContent=`⏱ ${seconds}s`},1000);qs('practiceMount').innerHTML=`<div class="question-card"><div class="question-head"><div><div class="question-meta">DOM. ${q.domain} · ${tConcept(q.concept||'Clinical Reasoning')} · ${translatedDifficulty(q.difficulty)}</div></div><div class="timer-pill" id="timePill">⏱ 0s</div></div><div class="question-text">${qText(q,'q')}</div><div id="opts">${Object.entries(opts).map(([l,t])=>`<button class="option" data-answer="${l}"><span class="option-letter">${l}</span><span>${t}</span></button>`).join('')}</div><div class="confidence-panel"><div class="conf-label">${L('confidence')}</div><div class="conf-opts"><button class="conf-btn" data-conf="low">${L('unsure')}</button><button class="conf-btn" data-conf="mid">${L('somewhat')}</button><button class="conf-btn" data-conf="high">${L('very')}</button></div></div><button class="btn btn-secondary" id="hintBtn">💡 ${L('hint')}</button><div id="hintBox" class="note-box hidden">${qText(q,'hint')||(lang==='es'?'Divide el escenario en antecedente, conducta, consecuencia y efecto futuro.':'Break the scenario into antecedent, behavior, consequence, and future effect.')}</div><div id="feedbackMount"></div></div>`;let conf=null;document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{conf=b.dataset.conf;document.querySelectorAll('[data-conf]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});qs('hintBtn').onclick=()=>qs('hintBox').classList.toggle('hidden');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuestion(b.dataset.answer,conf||'none'))}

function recordAnswer(q,letter,ok,conf,time){const dom=state.domains[q.domain]||state.domains.B;dom.total++;dom.correct+=ok?1:0;dom.last=Date.now();dom.accuracy=Math.round((dom.correct/dom.total)*100);const c=q.concept||'General';dom.concepts[c]=dom.concepts[c]||{total:0,correct:0,last:0,confidenceMiss:0};dom.concepts[c].total++;dom.concepts[c].correct+=ok?1:0;dom.concepts[c].last=Date.now();if(!ok&&conf==='high')dom.concepts[c].confidenceMiss++;dom.stability=Math.min(100,Math.round((dom.accuracy*.55)+((dom.total>=5?35:dom.total*7))-(recentMissPenalty(q.domain))));dom.retention=Math.min(100,Math.max(12,Math.round(dom.stability-(daysSince(dom.last)*3)+(ok?8:-4))));state.history.unshift({ts:Date.now(),domain:q.domain,concept:c,ok,conf,time,answer:letter,correct:q.correct});state.history=state.history.slice(0,120);state.readiness=calcReadiness();save();updateSide()}
function recentMissPenalty(domId){return state.history.slice(0,6).filter(x=>x.domain===domId&&!x.ok).length*7}
function daysSince(ts){return ts?((Date.now()-ts)/86400000):10}
async function renderChallenge(domId){state.currentView='challenge';bindNav();updateSide();currentDomain=domId||currentDomain;qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">${L('challengeTitle')}</div><div class="page-sub">${L('challengeSub')}</div></div><div class="topbar-right">${langSwitch()}<button class="btn btn-secondary" id="dash">${L('backDashboard')}</button></div></div><div class="complete-card"><div class="module-label">DOM. ${currentDomain}</div><div class="module-title">${L('readyChallenge')}</div><p class="page-sub">${L('challengeIntro')}</p><button class="btn btn-gold" id="startChallenge" style="margin-top:16px">${L('startChallenge')}</button></div>`;bindLang();qs('dash').onclick=renderDashboard;qs('startChallenge').onclick=async()=>{let score=0,idx=0,items=[];qs('main').innerHTML='<div class="loader"><div class="spinner"></div><strong>'+L('preparingExam')+'</strong></div>';for(let i=0;i<5;i++)items.push(await generateQuestion({domain:currentDomain,concept:pickConcept(currentDomain),mode:'exam'}));function show(){const q=items[idx];const opts=qOptions(q);qs('main').innerHTML=`<div class="question-card"><div class="question-head"><div class="question-meta">${L('challengeTitle')} · Item ${idx+1}/5 · DOM. ${q.domain}</div><div class="timer-pill">${L('examRealityMode')}</div></div><div class="question-text">${qText(q,'q')}</div>${Object.entries(opts).map(([l,t])=>`<button class="option" data-ch="${l}"><span class="option-letter">${l}</span><span>${t}</span></button>`).join('')}</div>`;document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const ok=b.dataset.ch===q.correct;score+=ok?1:0;recordAnswer(q,b.dataset.ch,ok,'exam',0);idx++;idx<items.length?show():finish()})}function finish(){qs('main').innerHTML=`<div class="complete-card"><div style="font-size:48px">${score>=4?'🏆':score>=3?'📈':'🎯'}</div><div class="module-title">${L('challengeComplete')}</div><p class="page-sub">${L('score')}: <strong>${score}/5</strong>. ${score>=4?L('challengeGood'):L('challengeNeeds')}</p><div class="note-box">${L('readinessReminder')}</div><button class="btn btn-primary" id="backAfterChallenge">${L('backToDashboard')}</button></div>`;qs('backAfterChallenge').onclick=renderDashboard}show()}}
function renderAnalytics(){state.currentView='analytics';bindNav();updateSide();qs('main').innerHTML=`<div class="topbar"><div><div class="page-title">${L('performanceInsights')}</div><div class="page-sub">${L('insightsSub')}</div></div><div class="topbar-right">${langSwitch()}</div></div><div class="metrics"><div class="metric"><div class="metric-value">${state.readiness}%</div><div class="metric-label">${L('examReadiness')}</div></div><div class="metric"><div class="metric-value">${Math.round(avg('stability'))}%</div><div class="metric-label">${L('averageStability')}</div></div><div class="metric"><div class="metric-value">${Math.round(avg('retention'))}%</div><div class="metric-label">${L('averageRetention')}</div></div><div class="metric"><div class="metric-value">${state.history.filter(x=>!x.ok&&x.conf==='high').length}</div><div class="metric-label">${L('confidenceAlerts')}</div></div></div><div class="domain-grid">${DOMAINS.map(domainCard).join('')}</div><div class="panel" style="margin-top:16px"><div class="panel-title">${L('recentHistory')}</div><div class="session-list">${state.history.slice(0,10).map(h=>`<div class="session-item"><span>${h.ok?'✓':'✗'} DOM. ${h.domain} · ${tConcept(h.concept)}</span><strong>${h.conf}</strong></div>`).join('')||'<div class="session-item"><span>'+L('noResponses')+'</span><strong>—</strong></div>'}</div></div>`;bindLang();bindDomainButtons()}
function avg(k){return DOMAINS.reduce((s,d)=>s+(state.domains[d.id][k]||0),0)/DOMAINS.length}
function render(){if(!['dashboard','study','practice','challenge','analytics'].includes(state.currentView))state.currentView='dashboard';if(!qs('app').classList.contains('active')&&state.onboarded){qs('landing').classList.remove('active');qs('onboarding').classList.remove('active');qs('app').classList.add('active')}if(state.currentView==='dashboard')renderDashboard();else if(state.currentView==='study')renderStudy();else if(state.currentView==='practice')renderPractice();else if(state.currentView==='challenge')renderChallenge();else if(state.currentView==='analytics')renderAnalytics();else renderDashboard()}
function adminModal(){qs('adminModal').classList.add('active');qs('adminKeyInput').value=getAdminKey()}qs('saveAdminKey').onclick=()=>{localStorage.setItem(KEY_STORAGE,qs('adminKeyInput').value.trim());state.adminConfigured=!!getAdminKey();save();qs('adminModal').classList.remove('active');showToast('Admin key saved locally.');startPreload()};qs('closeAdmin').onclick=()=>qs('adminModal').classList.remove('active');document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&String(e.key).toLowerCase()==='a')adminModal()});window.renderDashboard=renderDashboard;
renderLanding(); if(state.onboarded)render(); startPreload();
})();
</script>
</body>
</html>
