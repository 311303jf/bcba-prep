<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BCBA Study Hub — Full Version Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900&family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0B6B52;--green-dark:#084D3B;--green-light:#E0F3EC;--green-mid:#5CC9A0;
  --gold:#C9860B;--gold-light:#FEF3DC;--gold-border:#F5C76A;
  --blue:#2460A7;--blue-light:#E8F0FB;--blue-border:#8AB4E8;
  --purple:#6D28D9;--purple-light:#F3EEFF;--purple-border:#C4B5FD;
  --pink:#BE185D;--pink-light:#FFF0F6;--pink-border:#F9A8D4;
  --red:#C0392B;--red-light:#FDECEA;--red-border:#F0A099;
  --ok:#3B6D11;--ok-light:#EDF7E0;--ok-border:#97C459;
  --ink:#141412;--ink-mid:#444440;--ink-soft:#777772;--ink-faint:#ADADAA;
  --surface:#FAFAF8;--white:#FFFFFF;--border:#E4E4E0;--border-soft:#EFEFEC;
  --radius-sm:10px;--radius-md:16px;--radius-lg:22px;--radius-xl:30px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 10px 28px rgba(0,0,0,.10);
  --shadow-lg:0 22px 68px rgba(0,0,0,.14);
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--surface);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font-family:var(--font-body)}
button{cursor:pointer}
.screen{display:none}
.screen.active{display:block}

/* LANDING */
#landing.screen.active{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(circle at 15% 15%, rgba(224,243,236,.9), transparent 32%),
  radial-gradient(circle at 85% 25%, rgba(254,243,220,.85), transparent 28%),
  var(--surface);}
.land-card{background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:var(--radius-xl);padding:38px;max-width:680px;width:100%;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;backdrop-filter:blur(8px)}
.land-card::before{content:'';position:absolute;top:-70px;right:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,var(--green-light) 0%,transparent 70%);pointer-events:none;z-index:0}
.land-card>*{position:relative;z-index:1}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.brand-left{display:flex;align-items:center;gap:14px}
.brand-icon{background:var(--green-light);border-radius:19px;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:31px;flex-shrink:0;border:2px solid var(--green-mid)}
.brand-name{font-family:var(--font-display);font-size:32px;font-weight:900;line-height:1;color:var(--ink)}
.brand-tagline{font-size:12px;color:var(--ink-soft);margin-top:4px;font-weight:700}
.hero-box{background:linear-gradient(135deg,var(--green-dark),var(--green));border-radius:var(--radius-lg);padding:22px 24px;margin:18px 0;color:white}
.hero-eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;opacity:.8;margin-bottom:8px}
.hero-heading{font-family:var(--font-display);font-size:27px;font-weight:900;line-height:1.18;margin-bottom:8px}
.hero-sub{font-size:13.5px;opacity:.88;line-height:1.75}
.position-box{background:var(--gold-light);border:1px solid var(--gold-border);border-radius:var(--radius-md);padding:15px 16px;margin:14px 0;font-size:13px;color:#6f4703;font-weight:700;line-height:1.65}
.trust-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.trust-item{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:11px 12px;font-size:12px;color:var(--ink-mid);display:flex;align-items:center;gap:8px;font-weight:800}
.cta-btn{width:100%;background:linear-gradient(135deg,var(--green-dark),var(--green));color:white;border:none;border-radius:var(--radius-md);padding:17px;font-size:16px;font-weight:900;letter-spacing:.01em;transition:all .2s;box-shadow:0 4px 22px rgba(11,107,82,.34);margin-top:7px}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 9px 30px rgba(11,107,82,.42)}
.checklist{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.check-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:700}
.check-dot{width:17px;height:17px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--green);flex-shrink:0;font-weight:900}

/* language */
.lang-switch{display:flex;gap:4px;background:var(--border-soft);border-radius:999px;padding:3px}
.lang-btn{border:none;background:transparent;color:var(--ink-soft);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:900;cursor:pointer;transition:all .15s}
.lang-btn.active{background:var(--white);color:var(--green);box-shadow:var(--shadow-sm)}

/* APP */
#app.screen.active{display:block}
.layout{display:flex;height:100vh;overflow:hidden}
aside{width:255px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:20px;border-bottom:1px solid var(--border-soft)}
.sidebar-badge{font-size:9px;color:var(--green);font-weight:900;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
.sidebar-title{font-family:var(--font-display);font-size:23px;font-weight:900;color:var(--ink)}
.sidebar-sub{font-size:11px;color:var(--ink-soft);margin-top:3px;font-weight:700}
.sidebar-user{padding:13px 16px;background:var(--green-light);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
.user-avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(135deg,var(--green-dark),var(--green));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:white;flex-shrink:0}
.user-info{font-size:12px;color:var(--green-dark);font-weight:900;line-height:1.35}
.user-plan{font-size:10px;color:var(--ink-soft);font-weight:700}
nav{padding:10px 0;flex:1;overflow-y:auto}
.nav-section{font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);padding:12px 16px 4px}
.nav-btn{width:100%;padding:11px 16px;text-align:left;border:none;background:transparent;color:var(--ink-soft);font-size:13px;cursor:pointer;border-left:3px solid transparent;display:flex;gap:10px;align-items:center;font-weight:700;transition:all .15s}
.nav-btn:hover{background:var(--surface);color:var(--ink)}
.nav-btn.active{background:var(--green-light);color:var(--green-dark);border-left-color:var(--green);font-weight:900}
.sidebar-footer{border-top:1px solid var(--border-soft);padding:15px 16px}
.prog-label{font-size:10px;font-weight:900;color:var(--ink-soft);margin-bottom:7px;display:flex;justify-content:space-between}
.progress-bar{height:7px;background:var(--border-soft);border-radius:999px;margin-bottom:8px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-mid));border-radius:999px;width:73%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.streak-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gold);font-weight:900;margin-top:10px}
main{flex:1;overflow-y:auto;padding:28px;background:var(--surface)}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-family:var(--font-display);font-size:31px;font-weight:900;color:var(--ink);margin-bottom:4px;line-height:1.16}
.page-sub{font-size:13px;color:var(--ink-soft);line-height:1.65;font-weight:700}
.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;letter-spacing:.01em}
.btn-primary{background:linear-gradient(135deg,var(--green-dark),var(--green));color:white;box-shadow:0 3px 13px rgba(11,107,82,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(11,107,82,.38)}
.btn-secondary{background:var(--white);color:var(--ink-mid);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#E8A030);color:white;box-shadow:0 3px 12px rgba(201,134,11,.26)}
.btn-purple{background:linear-gradient(135deg,#4C1D95,var(--purple));color:white}
.btn-pink{background:linear-gradient(135deg,#831843,var(--pink));color:white}

/* DASHBOARD */
.dash-hero{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;align-items:center;background:linear-gradient(135deg,var(--green-dark),var(--green));color:white;border-radius:var(--radius-xl);padding:26px;box-shadow:var(--shadow-md);margin-bottom:18px;overflow:hidden;position:relative}
.dash-hero:after{content:'';position:absolute;right:-40px;bottom:-70px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.08)}
.dash-hero>*{position:relative;z-index:1}
.hero-dash-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.13em;opacity:.75;margin-bottom:7px}
.hero-dash-title{font-family:var(--font-display);font-size:30px;font-weight:900;line-height:1.15;margin-bottom:8px}
.hero-dash-sub{font-size:13px;line-height:1.75;opacity:.88}
.readiness-ring{--p:73;width:150px;height:150px;border-radius:50%;margin-left:auto;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center;position:relative}
.readiness-ring:after{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--green-dark)}
.ring-content{position:relative;z-index:1;text-align:center}
.ring-num{font-family:var(--font-display);font-size:39px;font-weight:900;line-height:1}
.ring-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.78;font-weight:900;margin-top:4px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-md);padding:17px;position:relative;overflow:hidden}
.metric::after{content:'';position:absolute;bottom:-22px;right:-22px;width:68px;height:68px;border-radius:50%;background:var(--green-light);opacity:.55}
.metric-value{font-family:var(--font-display);font-size:29px;font-weight:900;color:var(--green);line-height:1}
.metric-label{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:800}
.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-bottom:20px}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.panel-label{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px}
.focus-title{font-family:var(--font-display);font-size:24px;font-weight:900;margin-bottom:7px;color:var(--ink)}
.reason{background:var(--blue-light);border:1px solid var(--blue-border);border-left:4px solid var(--blue);border-radius:var(--radius-sm);padding:13px;font-size:13px;line-height:1.72;color:#184b84;margin:12px 0}
.session-list{display:flex;flex-direction:column;gap:8px}
.session-item{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--ink-mid);font-weight:800;display:flex;justify-content:space-between;gap:12px}
.session-item strong{color:var(--green-dark)}
.domain-title-row{font-family:var(--font-display);font-size:22px;font-weight:900;margin:22px 0 12px;color:var(--ink)}
.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}
.domain-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:17px;transition:all .2s}
.domain-card:hover{border-color:var(--green-mid);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:10px;font-weight:900;letter-spacing:.05em;margin-bottom:10px;text-transform:uppercase}
.pill.green{background:var(--green-light);color:var(--green)}
.pill.gold{background:var(--gold-light);color:var(--gold);border:1px solid var(--gold-border)}
.pill.purple{background:var(--purple-light);color:var(--purple);border:1px solid var(--purple-border)}
.pill.pink{background:var(--pink-light);color:var(--pink);border:1px solid var(--pink-border)}
.dom-name{font-size:15px;font-weight:900;line-height:1.32;color:var(--ink)}
.dom-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;font-weight:700}
.dom-bars{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.mini-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);font-weight:900}
.mini-track{height:6px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-mid));border-radius:99px}

/* Learn/Practice */
.learn-wrap,.practice-wrap{max-width:860px}
.learn-card,.question-card,.complete-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow-sm)}
.module-label{font-size:11px;font-weight:900;color:var(--green);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.module-title{font-family:var(--font-display);font-size:29px;font-weight:900;margin-bottom:10px;color:var(--ink)}
.definition{background:var(--surface);border-left:4px solid var(--green);border-radius:var(--radius-sm);padding:16px;margin:14px 0;font-size:14px;line-height:1.8;color:var(--ink-mid)}
.note-box{background:var(--blue-light);border:1px solid var(--blue-border);border-radius:var(--radius-sm);padding:14px;font-size:13px;line-height:1.75;margin:12px 0;color:#184b84}
.path-strip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.path-chip{font-size:11px;font-weight:900;border-radius:999px;padding:6px 11px;border:1px solid var(--border);background:#fff;color:var(--ink-soft)}
.path-chip.done{background:var(--ok-light);border-color:var(--ok-border);color:var(--ok)}
.path-chip.active{background:var(--green-light);border-color:var(--green-mid);color:var(--green-dark)}
.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.question-meta{font-size:12px;color:var(--ink-soft);font-weight:800}
.timer-pill{font-size:12px;font-weight:900;border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:5px;color:var(--green);background:var(--green-light);border:1px solid var(--green-mid)}
.timer-pill.exam{color:var(--gold);background:var(--gold-light);border-color:var(--gold-border)}
.question-text{font-size:15px;line-height:1.75;font-weight:600;margin-bottom:16px;background:var(--surface);border-radius:var(--radius-sm);padding:16px;color:var(--ink);border-left:4px solid var(--border)}
.option{width:100%;text-align:left;background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 15px;margin-bottom:8px;cursor:pointer;font-size:13.5px;line-height:1.6;font-weight:700;transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.option-letter{width:25px;height:25px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--ink-soft);flex-shrink:0;margin-top:1px;transition:all .15s}
.option:hover:not(:disabled){border-color:var(--green);background:var(--green-light)}
.option:hover:not(:disabled) .option-letter{background:var(--green);border-color:var(--green);color:white}
.option.correct{background:var(--ok-light);border-color:var(--ok-border)}
.option.correct .option-letter{background:var(--ok);border-color:var(--ok);color:white}
.option.wrong{background:var(--red-light);border-color:var(--red-border)}
.option.wrong .option-letter{background:var(--red);border-color:var(--red);color:white}
.option:disabled{cursor:default}
.confidence-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;margin:12px 0}
.conf-label{font-size:11px;font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.conf-opts{display:flex;gap:8px}
.conf-btn{flex:1;border:1.5px solid var(--border);background:var(--white);border-radius:var(--radius-sm);padding:10px 6px;font-size:12px;font-weight:800;color:var(--ink-mid);transition:all .15s;text-align:center}
.conf-btn.active{border-color:var(--green);background:var(--green-light);color:var(--green)}
.feedback{border-radius:var(--radius-md);padding:16px;font-size:13px;line-height:1.75;margin:14px 0}
.feedback.good{background:var(--ok-light);border:1px solid var(--ok-border)}
.feedback.bad{background:var(--red-light);border:1px solid var(--red-border)}
.feedback-title{font-size:15px;font-weight:900;margin-bottom:6px}
.feedback.good .feedback-title{color:var(--ok)}
.feedback.bad .feedback-title{color:var(--red)}
.exam-rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.rule-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px;text-align:center}
.rule-value{font-family:var(--font-display);font-size:28px;font-weight:900;color:var(--gold)}
.rule-label{font-size:11px;color:var(--ink-soft);font-weight:800;margin-top:3px}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.insight-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.insight-value{font-family:var(--font-display);font-size:31px;font-weight:900;color:var(--green)}
.insight-title{font-size:13px;font-weight:900;margin-top:3px}
.insight-copy{font-size:12px;color:var(--ink-soft);line-height:1.6;margin-top:6px;font-weight:700}

/* Admin */
.admin-panel{display:none;position:fixed;right:18px;bottom:18px;z-index:50;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);padding:16px;width:min(410px,calc(100vw - 36px))}
.admin-panel.active{display:block}
.admin-panel h3{font-family:var(--font-display);font-size:20px;margin-bottom:8px}
.admin-panel p{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px;font-weight:700}
.admin-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:12px;margin-bottom:9px}
.admin-row{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:840px){
  .layout{display:block;height:auto}
  aside{width:100%}
  nav{display:flex;overflow-x:auto;padding:0}
  .nav-section{display:none}
  .nav-btn{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;padding:10px 12px}
  .nav-btn.active{border-left:none;border-bottom-color:var(--green)}
  main{padding:16px}
  .dash-hero,.dash-grid{grid-template-columns:1fr}
  .readiness-ring{margin:0}
  .trust-grid,.exam-rules{grid-template-columns:1fr}
  .land-card{padding:26px}
}
</style>
</head>
<body>

<section id="landing" class="screen active">
  <div class="land-card">
    <div class="brand-row">
      <div class="brand-left">
        <div class="brand-icon">🧠</div>
        <div>
          <div class="brand-name">BCBA Study Hub</div>
          <div class="brand-tagline">Adaptive Mastery Learning System</div>
        </div>
      </div>
      <div id="landingLang"></div>
    </div>
    <div class="hero-box">
      <div class="hero-eyebrow" data-i="landEyebrow"></div>
      <div class="hero-heading" data-i="landHeading"></div>
      <div class="hero-sub" data-i="landSub"></div>
    </div>
    <div class="position-box" data-i="landPosition"></div>
    <div class="trust-grid">
      <div class="trust-item" data-i="trust1"></div>
      <div class="trust-item" data-i="trust2"></div>
      <div class="trust-item" data-i="trust3"></div>
      <div class="trust-item" data-i="trust4"></div>
    </div>
    <button type="button" class="cta-btn" id="startBtn" data-i="startDemo"></button>
    <div class="checklist">
      <div class="check-item"><span class="check-dot">✓</span><span data-i="check1"></span></div>
      <div class="check-item"><span class="check-dot">✓</span><span data-i="check2"></span></div>
      <div class="check-item"><span class="check-dot">✓</span><span data-i="check3"></span></div>
      <div class="check-item"><span class="check-dot">✓</span><span data-i="check4"></span></div>
      <div class="check-item"><span class="check-dot">✓</span><span data-i="check5"></span></div>
    </div>
  </div>

}

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

}
function go(v){ view=v; answered=null; confidence=''; render(); }

  document.documentElement.lang=lang;

}

};
